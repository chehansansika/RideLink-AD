server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: driver-vehicle-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb+srv://admin:admin123@dbcluster.eutnxe9.mongodb.net/ridelink_driver_db?retryWrites=true&w=majority&appName=dbCluster}
      database: ${MONGODB_DATABASE:ridelink_driver_db}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.ridelink: DEBUG
    org.springframework.data.mongodb: INFO
