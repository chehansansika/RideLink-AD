# Application Configuration
spring.application.name=fare-payment-service
server.port=8084

# MongoDB Configuration (persistence boundary for fare-payment-service)
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://chehansansika_db_user:${MONGO_PASSWORD:chehansansika_db_user}@cluster0.ujmvfyc.mongodb.net/ridelink_fare_payment_db?retryWrites=true&w=majority&appName=Cluster0}

# Fare Calculation Rules (Configurable)
# Formula: Total Fare = Base Fare + (Distance * Rate per KM) + Service Fee
fare.base-fare=100.0
fare.rate-per-km=40.0
fare.service-fee=25.0
fare.currency=LKR

# Inter-Service Communication (Ride Management Service)
ridelink.services.ride-management.url=${RIDE_SERVICE_URL:http://localhost:8083}
ridelink.services.ride-management.mock-mode=${RIDE_SERVICE_MOCK_MODE:true}

# Swagger / OpenAPI Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
